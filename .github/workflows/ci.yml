name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use package.json "packageManager" as the single pnpm pin (avoid dual version error)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true
